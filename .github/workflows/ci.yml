name: Leafline Continuous Integration

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main, development ]
  workflow_dispatch:

jobs:
  # ============================================================================
  # 1. STATIC ANALYSIS & LINTING
  # ============================================================================
  static-analysis:
    name: Lint & Static Code Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run Syntax and Style Checks
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=venv,.venv,node_modules,build,dist
          # Exit-zero treats all errors as warnings
          flake8 . --count --exit-zero --max-complexity=15 --max-line-length=160 --statistics --exclude=venv,.venv,node_modules,build,dist

  # ============================================================================
  # 2. SOIL & NUTRIENT SERVICE TESTS (NS-BR-01..08)
  # ============================================================================
  test-soil-service:
    name: Test Soil & Nutrient Service
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Execute Soil Rules & Boundary Unit Tests
        run: |
          python -m unittest discover -s microservice-3-soil/tests -t microservice-3-soil -p "test_rules.py" -v

  # ============================================================================
  # 3. ENVIRONMENT & WEATHER SERVICE TESTS
  # ============================================================================
  test-weather-service:
    name: Test Weather & Environment Service
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Weather Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r microservice-2-weather/backend/requirements.txt
          pip install pytest httpx

      - name: Execute Weather & Alternaria EDPS Tests
        run: |
          python -m pytest microservice-2-weather/backend/tests/ -o pythonpath=microservice-2-weather/backend -v

  # ============================================================================
  # 4. PLANT HEALTH SERVICE TESTS (PYTORCH INFERENCE & API)
  # ============================================================================
  test-plant-health:
    name: Test Plant Health Service (PyTorch ML)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyTorch CPU & Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r microservice-1-leafline/backend/requirements.txt
          pip install pytest httpx email-validator

      - name: Execute PyTorch Inference Contract Tests
        run: |
          python -m pytest microservice-1-leafline/backend/tests/test_inference.py -o pythonpath=microservice-1-leafline/backend -v

      - name: Execute Plant Health API Tests
        run: |
          python -m pytest microservice-1-leafline/backend/tests/test_api.py -o pythonpath=microservice-1-leafline/backend -v

  # ============================================================================
  # 5. API GATEWAY & E2E CROSS-SERVICE INTEGRATION TESTS
  # ============================================================================
  test-gateway-and-e2e:
    name: Test API Gateway & Mode B E2E
    runs-on: ubuntu-latest
    needs: [test-soil-service, test-weather-service, test-plant-health]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api-gateway/requirements.txt
          pip install pytest httpx Pillow

      - name: Run API Gateway Unit & Degradation Tests
        run: |
          python -m pytest api-gateway/tests/test_gateway.py -v

      - name: Run Platform E2E Cross-Service Integration Tests
        run: |
          python -m pytest tests/test_e2e_integration.py -v

  # ============================================================================
  # 6. COMMON FRONTEND BUILD VALIDATION
  # ============================================================================
  build-frontend:
    name: Build & Validate Common Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Production Assets
        working-directory: ./frontend
        run: npm run build
