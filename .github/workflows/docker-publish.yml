name: Docker Build & Publish to Docker Hub

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  workflow_dispatch:
    inputs:
      publish_to_dockerhub:
        description: 'Publish images to Docker Hub (requires secrets)'
        required: true
        type: boolean
        default: true
      image_tag:
        description: 'Custom Image Release Tag'
        required: false
        default: 'latest'

jobs:
  # ============================================================================
  # BUILD AND PUBLISH MICROSERVICES DOCKER IMAGES
  # ============================================================================
  build-and-push:
    name: Build & Publish Microservice Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine Docker Hub Credentials
        id: auth-check
        run: |
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] && [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "has_credentials=true" >> $GITHUB_OUTPUT
            echo "repo_owner=${{ secrets.DOCKERHUB_USERNAME }}" >> $GITHUB_OUTPUT
          else
            echo "has_credentials=false" >> $GITHUB_OUTPUT
            echo "repo_owner=leafline" >> $GITHUB_OUTPUT
            echo "::warning::Docker Hub secrets (DOCKERHUB_USERNAME, DOCKERHUB_TOKEN) are not set. Building images locally for validation only."
          fi

      - name: Log in to Docker Hub
        if: steps.auth-check.outputs.has_credentials == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 1. Microservice 1: Plant Health Image
      - name: Build Plant Health Image
        uses: docker/build-push-action@v5
        with:
          context: ./microservice-1-leafline/backend
          file: ./microservice-1-leafline/backend/Dockerfile
          push: ${{ steps.auth-check.outputs.has_credentials == 'true' }}
          tags: |
            ${{ steps.auth-check.outputs.repo_owner }}/leafline-plant-health:latest
            ${{ steps.auth-check.outputs.repo_owner }}/leafline-plant-health:1.0.0
            ${{ steps.auth-check.outputs.repo_owner }}/leafline-plant-health:${{ github.sha }}

      # 2. Microservice 2: Environment & Weather Image
      - name: Build Weather Service Image
        uses: docker/build-push-action@v5
        with:
          context: ./microservice-2-weather/backend
          file: ./microservice-2-weather/backend/Dockerfile
          push: ${{ steps.auth-check.outputs.has_credentials == 'true' }}
          tags: |
            ${{ steps.auth-check.outputs.repo_owner }}/leafline-weather-service:latest
            ${{ steps.auth-check.outputs.repo_owner }}/leafline-weather-service:2.0.0
            ${{ steps.auth-check.outputs.repo_owner }}/leafline-weather-service:${{ github.sha }}

      # 3. Microservice 3: Soil & Nutrient Image
      - name: Build Soil Service Image
        uses: docker/build-push-action@v5
        with:
          context: ./microservice-3-soil
          file: ./microservice-3-soil/Dockerfile
          push: ${{ steps.auth-check.outputs.has_credentials == 'true' }}
          tags: |
            ${{ steps.auth-check.outputs.repo_owner }}/leafline-soil-service:latest
            ${{ steps.auth-check.outputs.repo_owner }}/leafline-soil-service:1.0.0
            ${{ steps.auth-check.outputs.repo_owner }}/leafline-soil-service:${{ github.sha }}

      # 4. API Gateway & Orchestrator Image
      - name: Build API Gateway Image
        uses: docker/build-push-action@v5
        with:
          context: ./api-gateway
          file: ./api-gateway/Dockerfile
          push: ${{ steps.auth-check.outputs.has_credentials == 'true' }}
          tags: |
            ${{ steps.auth-check.outputs.repo_owner }}/leafline-api-gateway:latest
            ${{ steps.auth-check.outputs.repo_owner }}/leafline-api-gateway:1.0.0
            ${{ steps.auth-check.outputs.repo_owner }}/leafline-api-gateway:${{ github.sha }}

      # 5. Common Frontend Image
      - name: Build Common Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: ${{ steps.auth-check.outputs.has_credentials == 'true' }}
          tags: |
            ${{ steps.auth-check.outputs.repo_owner }}/leafline-frontend:latest
            ${{ steps.auth-check.outputs.repo_owner }}/leafline-frontend:1.0.0
            ${{ steps.auth-check.outputs.repo_owner }}/leafline-frontend:${{ github.sha }}
